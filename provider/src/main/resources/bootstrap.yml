spring:
  application:
    name: provider   # 对应 Nacos 中的 Data ID
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848  # Nacos 服务器地址
        file-extension: yaml          # 配置文件格式
        group: DEFAULT_GROUP         # 默认组
        namespace: dev               # 命名空间 ID（可选，用于环境隔离）
#      discovery:
#        server-addr: 127.0.0.1:8848  # Nacos 服务器地址 有了dubbo后这个可以不需要了，加上也没关系

server:
  port: 8080

dubbo:
  application:
    name: provider
  protocol:
    name: dubbo
    port: 20880
  registry:
    address: nacos://localhost:8848  # Nacos 注册中心地址
